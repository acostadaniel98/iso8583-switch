services:
  postgres:
    image: postgres:16-alpine
    container_name: switch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: switch
      POSTGRES_PASSWORD: switch
      POSTGRES_DB: switch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switch -d switch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
